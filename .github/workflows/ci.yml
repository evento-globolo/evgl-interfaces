name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run Rust unit, integration, and schema guard tests
        run: cargo test --locked --all-targets
      - name: Verify repository identity, conflict markers, and secrets in Rust
        run: cargo run --locked --bin verify_repo

name: Validate contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint openapi/evgl.yaml
      - run: npx --yes @asyncapi/cli validate asyncapi/jobs.yaml
      - run: node -e 'JSON.parse(require("fs").readFileSync("schema/provider-target.schema.json")); JSON.parse(require("fs").readFileSync("policy/provider-capabilities.json"))'
